<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — WiseBadger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0D103B;
    --magenta: #9A2099;
    --pink: #E592CA;
    --cream: #F0EAEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, #1A1550 55%, var(--magenta) 130%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--navy);
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--cream);
    border-radius: 24px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(13, 16, 59, 0.45);
  }
  .brand {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--magenta);
    margin-bottom: 18px;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.3;
    margin: 0 0 12px;
    color: var(--navy);
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #46456B;
    margin: 0 0 8px;
  }
  .icon-wrap {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 4px auto 22px;
    font-size: 34px;
  }
  .icon-wrap.success { background: rgba(154, 32, 153, 0.12); }
  .icon-wrap.error    { background: rgba(224, 122, 122, 0.15); }
  .spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 4px solid rgba(154, 32, 153, 0.18);
    border-top-color: var(--magenta);
    margin: 4px auto 22px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .support {
    font-weight: 700;
    color: var(--magenta);
    text-decoration: none;
  }
  .support:hover { text-decoration: underline; }
  .home-link {
    display: inline-block;
    margin-top: 24px;
    font-size: 13px;
    font-weight: 600;
    color: #8B89A8;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .home-link:hover {
    color: var(--magenta);
    border-bottom-color: var(--pink);
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">WiseBadger</div>
    <div id="state-loading">
      <div class="spinner"></div>
      <h1>Verifying your email…</h1>
      <p>Hang tight, this only takes a second.</p>
    </div>
    <div id="state-success" class="hidden">
      <div class="icon-wrap success">✅</div>
      <h1>Email verified!</h1>
      <p>Open WiseBadger on your phone to sign in.</p>
    </div>
    <div id="state-error" class="hidden">
      <div class="icon-wrap error">⚠️</div>
      <h1 id="error-title">Verification link didn't work</h1>
      <p id="error-message">This link may have expired or already been used.</p>
      <p>Need help? Email us at<br>
        <a class="support" href="mailto:WiseBadger@proton.me">WiseBadger@proton.me</a>
      </p>
    </div>
    <a class="home-link" href="index.html">← Return to home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://pjevaihjhedvkbgpaayx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqZXZhaWhqaGVkdmtiZ3BhYXl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMDcxMzksImV4cCI6MjA4ODg4MzEzOX0.bU9wpM43zUa5JDtebmOh-f8k0DKM4ArPOECwEa_AOd8';

    const loadingEl = document.getElementById('state-loading');
    const successEl = document.getElementById('state-success');
    const errorEl    = document.getElementById('state-error');
    const errorTitleEl   = document.getElementById('error-title');
    const errorMessageEl = document.getElementById('error-message');

    function showSuccess() {
      loadingEl.classList.add('hidden');
      successEl.classList.remove('hidden');
    }
    function showError(title, message) {
      loadingEl.classList.add('hidden');
      if (title)   errorTitleEl.textContent = title;
      if (message) errorMessageEl.textContent = message;
      errorEl.classList.remove('hidden');
    }
    function parseHashParams() {
      const hash = window.location.hash.startsWith('#')
        ? window.location.hash.slice(1)
        : window.location.hash;
      const params = new URLSearchParams(hash);
      return {
        access_token: params.get('access_token'),
        refresh_token: params.get('refresh_token'),
        type: params.get('type'),
        error_description: params.get('error_description'),
      };
    }
    async function verify() {
      const { access_token, refresh_token, error_description } = parseHashParams();
      if (error_description) {
        showError("Verification link didn't work", decodeURIComponent(error_description.replace(/\+/g, ' ')));
        return;
      }
      if (!access_token || !refresh_token) {
        showError('Missing verification link', 'This page needs a valid confirmation link from your email — please open the link from your inbox again.');
        return;
      }
      if (typeof window.supabase === 'undefined') {
        showError('Something went wrong', "We couldn't load the verification service. Please check your connection and try again.");
        return;
      }
      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { error } = await client.auth.setSession({ access_token, refresh_token });
        if (error) {
          showError('Verification link expired', 'This link may have already been used or has expired. Please request a new confirmation email from the app.');
          return;
        }
        showSuccess();
      } catch (err) {
        showError('Something went wrong', "We couldn't verify your email due to a network error. Please try again in a moment.");
      }
    }
    verify();
  </script>
</body>
</html>
